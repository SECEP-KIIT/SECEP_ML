<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Disagreement Review</title>
<style>
  :root {
    --bg: #0e1014; --panel: #161920; --panel-2: #1c2029; --line: #272c37;
    --text: #e7e9ee; --muted: #8d95a7; --faint: #5c6476; --accent: #8fb3ff;
    --ok: #5fcf8f; --warn: #f2b45a; --err: #ff6b6b; --amb: #c9a6ff;
    --a: #6ea8ff; --b: #f2a35a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  select, input[type=text], textarea {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
  }
  textarea { width: 100%; resize: vertical; font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
  }
  .brand { font-weight: 650; white-space: nowrap; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .progress { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 140px; }
  .bar { flex: 1; height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filters label { display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  .status { min-width: 80px; text-align: right; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .status.saving { color: var(--warn); } .status.saved { color: var(--ok); } .status.error { color: var(--err); }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: color-mix(in srgb, var(--accent) 20%, var(--panel-2)); border-color: var(--accent); }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
  #mail { overflow-y: auto; padding: 24px 32px 60px; }
  #side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #cards { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }

  .mail-card { max-width: 860px; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  h1.subject { font-size: 21px; line-height: 1.35; margin: 4px 0 14px; font-weight: 650; word-break: break-word; }
  .meta { display: grid; grid-template-columns: 56px 1fr; gap: 3px 12px; font-size: 13px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; }
  .meta dt { color: var(--faint); } .meta dd { margin: 0; color: var(--muted); word-break: break-word; }
  .meta dd.from { color: var(--text); font-weight: 550; }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.65; }
  details.ctx { margin-top: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  details.ctx summary { cursor: pointer; padding: 10px 14px; color: var(--muted); font-size: 13px; }
  .ctx-body { white-space: pre-wrap; word-break: break-word; padding: 12px 14px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

  .banner { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; margin-bottom: 14px; }
  .dcard { border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); padding: 12px; margin-bottom: 14px; }
  .dcard.done { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .dhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .dhead h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .dhead .pair { font-size: 12px; color: var(--faint); }
  .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .vote { border-radius: 9px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); }
  .vote small { display: block; font-size: 11.5px; color: var(--faint); }
  .vote b { font-size: 14.5px; }
  .vote.a { border-left: 3px solid var(--a); } .vote.b { border-left: 3px solid var(--b); }
  .note { font-size: 12.5px; color: var(--muted); background: var(--panel); border-radius: 8px; padding: 6px 9px; margin-bottom: 8px; white-space: pre-wrap; }
  .auto { font-size: 12px; color: var(--ok); margin-bottom: 8px; }
  .lab { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 5px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { padding: 6px 11px; border-radius: 8px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); }
  .opt:hover { border-color: var(--accent); }
  .opt.on { background: color-mix(in srgb, var(--accent) 24%, var(--panel)); border-color: var(--accent); }
  .opt.amb.on { background: color-mix(in srgb, var(--amb) 24%, var(--panel)); border-color: var(--amb); }
  .opt .who { font-size: 10.5px; color: var(--faint); margin-left: 4px; }
  .rulepick { display: flex; gap: 6px; }
  .rulepick select { flex: 1; min-width: 0; }
  .ruletext { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }

  #nav { border-top: 1px solid var(--line); padding: 10px 16px 12px; flex: none; }
  .nav-row { display: flex; gap: 8px; align-items: center; }
  .nav-row .btn { padding: 7px 10px; }
  .pos { color: var(--muted); font-size: 13px; min-width: 72px; text-align: center; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(22, 1fr); gap: 2px; margin-top: 10px; }
  .cell { height: 11px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .cell.part { background: color-mix(in srgb, var(--warn) 45%, var(--panel-2)); border-color: transparent; }
  .cell.done { background: color-mix(in srgb, var(--ok) 55%, var(--panel-2)); border-color: transparent; }
  .cell.out { opacity: .25; }
  .cell.cur { outline: 2px solid var(--text); }

  /* rules drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--panel);
    border-left: 1px solid var(--line); z-index: 30; display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform .2s; }
  .drawer.open { transform: none; box-shadow: -20px 0 50px rgba(0,0,0,.45); }
  .drawer header { position: static; }
  .drawer .list { flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
  .rcard { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; background: var(--panel-2); }
  .rcard.agreed { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
  .rcard.rejected { opacity: .55; }
  .rtop { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; flex-wrap: wrap; }
  .rid { font: 600 12px var(--mono); color: var(--accent); }
  .rtop input { flex: 1; min-width: 140px; font-size: 12.5px; padding: 3px 8px; }
  .stat { display: flex; gap: 4px; }
  .stat button { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .stat button.on[data-s=agreed] { border-color: var(--ok); color: var(--ok); }
  .stat button.on[data-s=draft] { border-color: var(--warn); color: var(--warn); }
  .stat button.on[data-s=rejected] { border-color: var(--err); color: var(--err); }
  .rmeta { font-size: 11.5px; color: var(--faint); margin-top: 5px; }
  .hgroup { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }

  .overlay { position: fixed; inset: 0; background: rgba(8,9,12,.82); display: grid; place-items: center; z-index: 40; }
  .overlay[hidden] { display: none; }
  .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: min(760px, calc(100vw - 32px)); }
  .dialog h2 { margin: 0 0 6px; font-size: 18px; }
  .dialog p { margin: 0 0 12px; color: var(--muted); }
  .spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #3a1d22; border: 1px solid var(--err);
    color: #ffd9d9; padding: 10px 14px; border-radius: 10px; z-index: 50; display: flex; gap: 12px; align-items: center; font-size: 13px; max-width: calc(100vw - 32px); }
  .toast.info { background: #1d2a3a; border-color: var(--accent); color: var(--text); }
  .toast[hidden] { display: none; }
  .toast button { background: var(--err); border: 0; color: #1a0b0d; border-radius: 7px; padding: 4px 10px; cursor: pointer; font-weight: 600; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    #mail { max-height: 55vh; padding: 16px; }
    #side { border-left: 0; border-top: 1px solid var(--line); }
    #cards { flex: none; overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Disagreement Review<small id="sheetName"></small></div>
  <div class="filters">
    <select id="fHead" aria-label="Head"><option value="">All heads</option><option>type</option><option>urgency</option><option>sentiment</option></select>
    <select id="fPair" aria-label="Pair"><option value="">All pairs</option></select>
    <label><input type="checkbox" id="fOpen"> Undecided only</label>
  </div>
  <div class="progress"><div class="bar"><i id="barFill"></i></div><span class="count" id="count">–</span></div>
  <span class="status" id="status" aria-live="polite"></span>
  <button class="btn" id="rulesBtn">Rules</button>
  <button class="btn primary" id="exportBtn">Export ruleset</button>
  <button class="btn" id="reloadBtn" title="Fetch the latest from the sheet">Reload</button>
</header>

<main>
  <section id="mail" aria-label="Email"></section>
  <aside id="side">
    <div id="cards"></div>
    <div id="nav">
      <div class="nav-row">
        <button class="btn" id="prevBtn">←</button>
        <span class="pos" id="pos">–</span>
        <button class="btn" id="nextBtn">→</button>
        <button class="btn primary" id="todoBtn" style="flex:1">Next undecided ⏎</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </aside>
</main>

<div class="drawer" id="drawer" aria-label="Rules">
  <header>
    <div class="brand">Rules<small>agree, edit or reject — only “agreed” rules are exported</small></div>
    <span style="flex:1"></span>
    <button class="btn" id="addRuleBtn">+ New rule</button>
    <button class="btn" id="closeDrawer">Close</button>
  </header>
  <div class="list" id="ruleList"></div>
</div>

<div class="overlay" id="loading"><div class="dialog" style="text-align:center;width:340px"><div class="spinner"></div><p id="loadingMsg" style="margin:0">Loading…</p></div></div>
<div class="overlay" id="exportBox" hidden><div class="dialog">
  <h2>Agreed ruleset</h2>
  <p>Also saved to the sheet’s <b>Ruleset</b> tab. Paste it into <code>labelling-guide.md</code>.</p>
  <textarea id="exportText" rows="18" readonly></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button class="btn" id="copyBtn">Copy</button><button class="btn primary" id="closeExport">Done</button>
  </div>
</div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastBtn">Retry</button></div>

<script>
(function () {
  'use strict';
  const S = { items: [], emails: {}, rules: [], enums: {}, extra: [], queue: [], i: 0, pending: 0, newRuleFor: null };
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem('dr.' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('dr.' + k, v); } catch (e) {} },
  };
  function call(fn, ...args) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  }
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids) if (c != null) n.append(c);
    return n;
  }
  function setStatus(kind, t) { const s = $('status'); s.className = 'status ' + kind; s.textContent = t; }
  function toast(msg, retry, info) {
    $('toast').className = 'toast' + (info ? ' info' : ''); $('toastMsg').textContent = msg; $('toast').hidden = false;
    $('toastBtn').hidden = !retry;
    $('toastBtn').onclick = () => { $('toast').hidden = true; retry && retry(); };
    if (!retry) setTimeout(() => { $('toast').hidden = true; }, 4000);
  }
  const loading = (m) => { $('loadingMsg').textContent = m; $('loading').hidden = false; };
  const loaded = () => { $('loading').hidden = true; };

  // ---------------- data
  const itemsOf = (uid) => S.items.filter((it) => it.email_uid === uid);
  const emailDone = (uid) => itemsOf(uid).every((it) => it.verdict);
  const emailStarted = (uid) => itemsOf(uid).some((it) => it.verdict || it.rule_id || it.comment);
  const ruleById = (id) => S.rules.find((r) => r.rule_id === id);

  async function load(keepUid) {
    loading('Loading the review sheet…');
    try {
      const d = await call('getData');
      S.items = d.items; S.rules = d.rules; S.enums = d.enums; S.extra = d.verdictExtra;
      S.emails = {}; d.emails.forEach((e) => { S.emails[e.email_uid] = e; });
      $('sheetName').textContent = '· ' + d.sheetName;
      const pairs = [...new Set(S.items.map((it) => it.head + ' · ' + it.pair))].sort();
      const fp = $('fPair'); const prev = fp.value; fp.innerHTML = '';
      fp.append(el('option', { value: '', text: 'All pairs' }));
      pairs.forEach((p) => fp.append(el('option', { value: p, text: p })));
      fp.value = pairs.includes(prev) ? prev : '';
      buildQueue(keepUid || store.get('uid'));
      renderRules();
      setStatus('', S.items.length + ' disagreements');
      loaded();
    } catch (e) { loading('Could not load: ' + (e.message || e)); }
  }

  function buildQueue(keepUid) {
    const h = $('fHead').value, p = $('fPair').value, open = $('fOpen').checked;
    const uids = [...new Set(S.items.map((it) => it.email_uid))];
    S.all = uids;
    S.queue = uids.filter((u) => itemsOf(u).some((it) =>
      (!h || it.head === h) && (!p || (it.head + ' · ' + it.pair) === p) && (!open || !it.verdict)));
    let i = keepUid ? S.queue.indexOf(keepUid) : -1;
    S.i = i >= 0 ? i : 0;
    buildGrid(); render();
  }

  // ---------------- render email + cards
  function render() {
    const uid = S.queue[S.i];
    const mail = $('mail'); mail.innerHTML = ''; $('cards').innerHTML = '';
    renderProgress();
    if (!uid) { mail.append(el('p', { class: 'chip', text: 'Nothing matches these filters.' })); return; }
    store.set('uid', uid);
    const e = S.emails[uid] || {};
    const card = el('article', { class: 'mail-card' },
      el('div', { class: 'chips' },
        el('span', { class: 'chip' }, 'Recipient ', el('b', { text: e.recipient_role || '—' })),
        el('span', { class: 'chip' }, 'Position ', el('b', { text: e.recipient_position || '—' })),
        el('span', { class: 'chip' }, 'Disputed ', el('b', { text: itemsOf(uid).map((i) => i.head).join(', ') }))),
      el('h1', { class: 'subject', text: e.subject || '(no subject)' }));
    const meta = el('dl', { class: 'meta' });
    [['From', e.from, 'from'], ['To', e.to], ['Cc', e.cc], ['Date', e.date]].forEach(([k, v, c]) => {
      if (v) meta.append(el('dt', { text: k }), el('dd', { class: c || '', text: v }));
    });
    card.append(meta, el('div', { class: 'body', text: e.body || '(empty body)' }));
    if ((e.earlier_thread || '').trim()) {
      const d = el('details', { class: 'ctx' }, el('summary', { text: 'Earlier in this thread' }), el('div', { class: 'ctx-body', text: e.earlier_thread }));
      card.append(d);
    }
    mail.append(card); mail.scrollTop = 0;

    const cards = $('cards');
    cards.append(el('div', { class: 'banner', text: 'Decide what the RIGHT label is and which rule makes it so. Verdicts shape the guide and the teacher prompt — they never change a gold label.' }));
    itemsOf(uid).forEach((it) => cards.append(itemCard(it)));
    $('pos').textContent = (S.i + 1) + ' of ' + S.queue.length;
  }

  function itemCard(it) {
    const c = el('div', { class: 'dcard' + (it.verdict ? ' done' : '') });
    c.append(el('div', { class: 'dhead' }, el('h3', { text: it.head }), el('span', { class: 'pair', text: it.pair })));
    c.append(el('div', { class: 'votes' },
      el('div', { class: 'vote a' }, el('small', { text: it.labeller_a }), el('b', { text: it.label_a })),
      el('div', { class: 'vote b' }, el('small', { text: it.labeller_b }), el('b', { text: it.label_b }))));
    if (it.resolution === 'precedence') c.append(el('div', { class: 'auto', text: '✓ Already settled by precedence → ' + it.final + ' (confirm, or explain why not)' }));
    if (it.notes) c.append(el('div', { class: 'note', text: it.notes }));

    c.append(el('div', { class: 'lab', text: 'Team verdict' }));
    const opts = el('div', { class: 'opts' });
    (S.enums[it.head] || []).concat(S.extra).forEach((v) => {
      const who = [it.label_a === v ? it.labeller_a : '', it.label_b === v ? it.labeller_b : ''].filter(Boolean).join(', ');
      opts.append(el('button', { class: 'opt' + (v === 'Ambiguous' ? ' amb' : '') + (it.verdict === v ? ' on' : ''),
        onclick: () => saveItem(it, 'verdict', it.verdict === v ? '' : v) }, v, who ? el('span', { class: 'who', text: who }) : null));
    });
    c.append(opts);

    c.append(el('div', { class: 'lab', text: 'Which rule decides it?' }));
    const sel = el('select', { 'aria-label': 'Rule' });
    sel.append(el('option', { value: '', text: '— none yet —' }));
    S.rules.filter((r) => (r.head === it.head) && r.status !== 'rejected').forEach((r) =>
      sel.append(el('option', { value: r.rule_id, text: r.rule_id + ' · ' + (r.pair || '') + ' (' + r.status + ')' })));
    sel.append(el('option', { value: '__new', text: '+ New rule from this…' }));
    sel.value = it.rule_id || '';
    sel.onchange = () => {
      if (sel.value === '__new') { sel.value = it.rule_id || ''; openNewRule(it); return; }
      saveItem(it, 'rule_id', sel.value);
    };
    c.append(el('div', { class: 'rulepick' }, sel));
    const r = ruleById(it.rule_id);
    if (r) c.append(el('div', { class: 'ruletext', text: r.rule }));

    c.append(el('div', { class: 'lab', text: 'Why (one line)' }));
    const ta = el('textarea', { rows: '2', placeholder: 'e.g. "asks him to send the file → Task"' });
    ta.value = it.comment || '';
    ta.addEventListener('blur', () => { if ((it.comment || '') !== ta.value.trim()) saveItem(it, 'comment', ta.value.trim(), true); });
    c.append(ta);
    return c;
  }

  function buildGrid() {
    const g = $('grid'); g.innerHTML = '';
    S.all.forEach((u) => g.append(el('button', { class: 'cell', title: (S.emails[u] || {}).subject || u, onclick: () => {
      let j = S.queue.indexOf(u);
      if (j < 0) { $('fHead').value = ''; $('fPair').value = ''; $('fOpen').checked = false; buildQueue(u); return; }
      S.i = j; render();
    } })));
  }

  function renderProgress() {
    const done = S.items.filter((it) => it.verdict).length;
    $('count').textContent = done + ' / ' + S.items.length + ' decided';
    $('barFill').style.width = (S.items.length ? 100 * done / S.items.length : 0) + '%';
    const cur = S.queue[S.i]; const inQ = new Set(S.queue);
    [...$('grid').children].forEach((c, k) => {
      const u = S.all[k];
      c.className = 'cell' + (emailDone(u) ? ' done' : emailStarted(u) ? ' part' : '') + (inQ.has(u) ? '' : ' out') + (u === cur ? ' cur' : '');
    });
    $('prevBtn').disabled = S.i <= 0; $('nextBtn').disabled = S.i >= S.queue.length - 1;
  }

  // ---------------- saving
  function saveItem(it, field, value, quiet) {
    const prev = it[field];
    it[field] = value;
    if (!quiet) render(); else renderProgress();
    S.pending++; setStatus('saving', 'Saving…');
    call('saveItem', it.item_id, field, value).then(() => {
      S.pending--; if (!S.pending) setStatus('saved', 'Saved ✓');
    }).catch((e) => {
      S.pending--; it[field] = prev; render(); setStatus('error', 'Not saved');
      toast('Couldn’t save: ' + (e.message || e), () => saveItem(it, field, value, quiet));
    });
  }

  function saveRule(rule, after) {
    S.pending++; setStatus('saving', 'Saving…');
    return call('saveRule', rule).then((saved) => {
      S.pending--; if (!S.pending) setStatus('saved', 'Saved ✓');
      const k = S.rules.findIndex((r) => r.rule_id === saved.rule_id);
      if (k >= 0) S.rules[k] = saved; else S.rules.push(saved);
      renderRules(); render();
      if (after) after(saved);
      return saved;
    }).catch((e) => {
      S.pending--; setStatus('error', 'Not saved');
      toast('Couldn’t save rule: ' + (e.message || e), () => saveRule(rule, after));
    });
  }

  // ---------------- rules drawer
  function renderRules() {
    const list = $('ruleList'); list.innerHTML = '';
    ['type', 'urgency', 'sentiment'].forEach((h) => {
      const rs = S.rules.filter((r) => r.head === h);
      list.append(el('div', { class: 'hgroup', text: h + ' · ' + rs.filter((r) => r.status === 'agreed').length + ' agreed' }));
      rs.forEach((r) => list.append(ruleCard(r)));
    });
    const other = S.rules.filter((r) => !['type', 'urgency', 'sentiment'].includes(r.head));
    other.forEach((r) => list.append(ruleCard(r)));
  }

  function ruleCard(r) {
    const linked = S.items.filter((it) => it.rule_id === r.rule_id).length;
    const pair = el('input', { type: 'text', value: r.pair || '', placeholder: 'which disagreement, e.g. Info ↔ Task', 'aria-label': 'Pair' });
    pair.addEventListener('blur', () => { if (pair.value !== (r.pair || '')) saveRule({ rule_id: r.rule_id, pair: pair.value }); });
    const stat = el('div', { class: 'stat' });
    ['draft', 'agreed', 'rejected'].forEach((s) => stat.append(el('button', { 'data-s': s, class: r.status === s ? 'on' : '', text: s,
      onclick: () => { if (r.status !== s) saveRule({ rule_id: r.rule_id, status: s }); } })));
    const ta = el('textarea', { rows: '3' }); ta.value = r.rule || '';
    ta.addEventListener('blur', () => { if (ta.value.trim() !== (r.rule || '')) saveRule({ rule_id: r.rule_id, rule: ta.value.trim() }); });
    return el('div', { class: 'rcard ' + (r.status || '') },
      el('div', { class: 'rtop' }, el('span', { class: 'rid', text: r.rule_id }), pair, stat),
      ta, el('div', { class: 'rmeta', text: linked + ' disagreement' + (linked === 1 ? '' : 's') + ' linked' + (r.updated_by && r.updated_by !== 'draft' ? ' · last edit ' + r.updated_by : '') }));
  }

  function openNewRule(it) {
    const head = it ? it.head : ($('fHead').value || 'type');
    saveRule({ head: head, pair: it ? it.pair : '', status: 'draft', rule: 'Write the rule here.' }, (saved) => {
      if (it) saveItem(it, 'rule_id', saved.rule_id);
      $('drawer').classList.add('open');
      setTimeout(() => {
        const cards = [...$('ruleList').querySelectorAll('.rcard')];
        const mine = cards.find((c) => c.querySelector('.rid').textContent === saved.rule_id);
        if (mine) { mine.scrollIntoView({ block: 'center' }); const t = mine.querySelector('textarea'); t.focus(); t.select(); }
      }, 220);
    });
  }

  // ---------------- navigation + wiring
  function go(i) { if (i >= 0 && i < S.queue.length) { document.activeElement && document.activeElement.blur(); S.i = i; render(); } }
  function nextOpen() {
    const n = S.queue.length;
    for (let k = 1; k <= n; k++) { const j = (S.i + k) % n; if (!emailDone(S.queue[j])) return go(j); }
    toast('Every disagreement in this view has a verdict.', null, true);
  }
  $('prevBtn').onclick = () => go(S.i - 1);
  $('nextBtn').onclick = () => go(S.i + 1);
  $('todoBtn').onclick = nextOpen;
  $('reloadBtn').onclick = () => load(S.queue[S.i]);
  ['fHead', 'fPair', 'fOpen'].forEach((id) => $(id).addEventListener('change', () => buildQueue(S.queue[S.i])));
  $('rulesBtn').onclick = () => $('drawer').classList.add('open');
  $('closeDrawer').onclick = () => $('drawer').classList.remove('open');
  $('addRuleBtn').onclick = () => openNewRule(null);
  $('exportBtn').onclick = () => {
    setStatus('saving', 'Building…');
    call('exportRuleset').then((md) => {
      setStatus('saved', 'Exported ✓'); $('exportText').value = md; $('exportBox').hidden = false;
    }).catch((e) => { setStatus('error', 'Export failed'); toast(String(e.message || e)); });
  };
  $('closeExport').onclick = () => { $('exportBox').hidden = true; };
  $('copyBtn').onclick = async () => {
    const t = $('exportText');
    try { await navigator.clipboard.writeText(t.value); toast('Copied.', null, true); }
    catch (e) { t.focus(); t.select(); toast('Press Ctrl+C to copy the selected text.', null, true); }
  };
  document.addEventListener('keydown', (ev) => {
    const tag = ev.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') { if (ev.key === 'Escape') ev.target.blur(); return; }
    if (ev.key === 'Escape') { $('drawer').classList.remove('open'); $('exportBox').hidden = true; }
    if (!$('exportBox').hidden || $('drawer').classList.contains('open')) return;
    if (ev.key === 'ArrowRight') go(S.i + 1);
    else if (ev.key === 'ArrowLeft') go(S.i - 1);
    else if (ev.key === 'Enter') { nextOpen(); ev.preventDefault(); }
  });
  window.addEventListener('beforeunload', (e) => { if (S.pending) { e.preventDefault(); e.returnValue = ''; } });

  load();
})();
</script>
</body>
</html>
